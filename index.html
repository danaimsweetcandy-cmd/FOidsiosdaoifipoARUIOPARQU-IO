<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171523">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>가계부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="month-pick" id="monthPick">
    <span id="monthLabel">이번 달</span>
    <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>
  <div class="topsum" aria-label="이번 달 지출과 수입"><span class="ts-out" id="sumOut">0</span><span class="ts-div">/</span><span class="ts-in" id="sumIn">0</span></div>
  <button class="syncdot" id="syncBtn" type="button" aria-label="동기화 상태: 연동 안 함" title="동기화 상태"><span class="dot" id="syncDot" aria-hidden="true"></span></button>
</header>
<main>
<section class="view" id="view-add" data-view="add">
  <div class="addtop">
    <div class="seg" role="tablist" aria-label="거래 유형">
      <button class="seg-b is-on" data-type="지출" role="tab" aria-selected="true">지출</button>
      <button class="seg-b" data-type="수입" role="tab" aria-selected="false">수입</button>
      <button class="seg-b" data-type="이체" role="tab" aria-selected="false">이체</button>
      <span class="seg-ind" id="segInd" aria-hidden="true"></span>
    </div>
    <div class="amount" id="amountBox" aria-live="polite"><span class="am-sign" id="amSign">-</span><span class="am-num" id="amNum">0</span><span class="am-won">원</span></div>
    <div class="preset-row" id="presetRow" aria-label="자주 쓰는 항목"></div>
    <div class="catgrid" id="catGrid" aria-label="대분류"></div>
    <div class="subrow" id="subRow" aria-label="소분류"></div>
    <div class="payrow" id="payRow" aria-label="결제수단"></div>
    <div class="metarow">
      <input class="memo" id="memo" type="text" placeholder="메모" autocomplete="off" enterkeyhint="done" maxlength="80" aria-label="메모">
      <label class="fixed-t" id="fixedWrap"><input type="checkbox" id="fixedChk"><span>고정비</span></label>
      <input class="datepick" id="datePick" type="date" aria-label="날짜">
    </div>
  </div>
  <div class="editbar" id="editBar" hidden><span>수정 중</span><button id="editDel" type="button">삭제</button><button id="editCancel" type="button">취소</button></div>
  <div class="keypad" id="keypad" aria-label="금액 입력 키패드">
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
    <button class="k k-fn" data-k="del" aria-label="한 자리 지우기"><svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true"><path d="M8 1h14a1 1 0 011 1v14a1 1 0 01-1 1H8L1 9z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 6l6 6M18 6l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k k-fn" data-k="00">00</button>
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k k-fn" data-k="000">000</button>
    <button class="k k-zero" data-k="0">0</button><button class="k k-save" id="saveBtn" type="button" disabled>저장</button>
  </div>
</section>
<section class="view" id="view-list" data-view="list" hidden><div class="listwrap" id="listWrap"></div></section>
<section class="view" id="view-stat" data-view="stat" hidden><div class="statwrap" id="statWrap"></div></section>
<section class="view" id="view-set" data-view="set" hidden>
  <div class="setwrap">
    <h2>동기화</h2>
    <p class="hint">저장은 항상 이 기기에 먼저 완료돼. 시트를 연결하면 온라인일 때 자동으로 맞춰져.</p>
    <label class="field"><span>웹앱 주소</span><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>
    <label class="field"><span>토큰</span><span class="secretrow"><input id="cfgToken" type="password" placeholder="Code.gs와 같은 토큰" autocomplete="off"><button class="mini" id="toggleToken" type="button" aria-pressed="false">보기</button></span></label>
    <label class="switch"><input type="checkbox" id="cfgAuto" checked><span>저장할 때 자동 동기화</span></label>
    <div class="btnrow"><button class="btn primary" id="testConn" type="button">연결 확인</button><button class="btn" id="syncNow" type="button">지금 동기화</button><button class="btn" id="fullSync" type="button">전체 다시 맞추기</button></div>
    <p class="hint statusline" id="syncMsg" role="status" aria-live="polite"></p>
    <h2>자주 쓰는 항목</h2>
    <p class="hint">입력 화면의 원탭 버튼. 금액과 분류를 한 번에 채워.</p>
    <div class="presetedit" id="presetEdit"></div><button class="btn" id="presetAdd" type="button">지금 입력값을 추가</button>
    <h2>데이터 · 백업</h2>
    <div class="btnrow"><button class="btn" id="expCsv" type="button">CSV 내보내기</button><button class="btn" id="expJson" type="button">JSON 백업</button><button class="btn" id="impJson" type="button">백업 불러오기</button></div>
    <p class="hint" id="dataMsg"></p>
    <div class="dangerzone"><h2>복구 · 초기화</h2><p class="hint">로컬 캐시를 비워도 시트 데이터는 다음 동기화 때 다시 내려와.</p><button class="btn btn-danger" id="wipe" type="button">로컬 캐시 초기화</button></div>
    <h2>앱 정보</h2>
    <p class="hint" id="appInfo">가계부 v3.0.0 · 데이터 schema 3</p><p class="hint" id="storageMsg"></p>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </div>
</section>
</main>
<nav class="tabbar" aria-label="주요 메뉴">
  <button class="tab is-on" data-go="add" type="button" aria-current="page">입력</button><button class="tab" data-go="list" type="button">내역</button><button class="tab" data-go="stat" type="button">통계</button><button class="tab" data-go="set" type="button">설정</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="undo" id="undoBar" role="status" aria-live="assertive" hidden><span id="undoText">삭제했어</span><button id="undoBtn" type="button">실행 취소</button></div>
<script src="app.js"></script>
</body>
</html>
